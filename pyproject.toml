[project]
name = "se3-yolo"
version = "0.1.0"
description = "基于 Ultralytics YOLO 的 RoboMaster 目标检测模型训练仓库（装甲板 / 能量机关 / 机器人）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "opencv-python>=4.13.0.92",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "ultralytics>=8.4.60",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "prek>=0.4.4",
    "ruff>=0.15.16",
]
